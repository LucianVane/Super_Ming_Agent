name: Import Super Ming Agent
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-super-ming.yml]
permissions:
  contents: write
concurrency: import-super-ming
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Load the exact source snapshot and branding
        env:
          BRANDING_PAYLOAD: 
        run: |
          set -euo pipefail
          git remote add source https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --depth=1 source 8bd073392eef6f54e921a093b95076248eb08cbb
          git checkout --detach FETCH_HEAD
          python3 - <<'PYTHON'
          import os, json, base64, zlib
          from pathlib import Path
          files = json.loads(zlib.decompress(base64.b64decode(os.environ['BRANDING_PAYLOAD'])))
          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
          PYTHON
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.28.5
          pnpm install --frozen-lockfile
      - name: Recheck corrected README formatting
        env:
          DSH_CLIENT_TITLE: Super Ming Agent
        run: |
          pnpm run verify-md-wrap
          pnpm run verify-translation-pairing
          pnpm run verify-md-links
      - name: Publish the verified source snapshot
        env:
          IMPORT_BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          for path in Path('.github/workflows').rglob('*'):
              if path.is_file():
                  path.unlink()
          PYTHON
          git checkout "$IMPORT_BASE" -- .github/workflows
          git add -A
          git diff --cached --check
          tree=$(git write-tree)
          commit=$(git -c user.name='LucianVane' -c user.email='3864304+LucianVane@users.noreply.github.com' commit-tree "$tree" -p "$IMPORT_BASE" -m 'Import DeepSeek Harness source snapshot as Super Ming Agent' -m 'Source: deepseek-ai/deepseek-harness at 8bd073392eef6f54e921a093b95076248eb08cbb. Rebrand README and app metadata; preserve upstream licenses.')
          git push origin "$commit:refs/heads/main"
          echo "Published commit: $commit" >> "$GITHUB_STEP_SUMMARY"
