      <text x="505" y="228" text-anchor="middle" font-size="22" font-weight="900" fill="#B23A2E">内阁</text>
      <text x="505" y="252" text-anchor="middle" font-size="12.5" fill="#22507A" font-family="'SFMono-Regular', 'Songti SC', Consolas, monospace">Router 层 · 常驻 · 轻量模型</text>
      <text x="505" y="270" text-anchor="middle" font-size="11.5" fill="#5A615F">票拟、分派、全局记忆</text>
    </g>

    <g>
