      <text x="865" y="252" text-anchor="middle" font-size="12.5" fill="#22507A" font-family="'SFMono-Regular', 'Songti SC', Consolas, monospace">Watchdog</text>
      <text x="865" y="272" text-anchor="middle" font-size="11.5" fill="#5A615F">体系外的控制回路</text>
      <text x="865" y="290" text-anchor="middle" font-size="11.5" fill="#5A615F">考成法 · 按期稽查</text>
    </g>

    <g>
      <rect x="230" y="372" width="550" height="108" rx="6" fill="#E1E7E1" stroke="#1E2226" stroke-width="1.4"/>
      <text x="505" y="398" text-anchor="middle" font-size="19" font-weight="900" fill="#1E2226">六部 · Worker 层（上下文隔离、各管一案、最强模型）</text>
      <g font-size="15" font-weight="900" fill="#1E2226" text-anchor="middle">
        <rect x="250" y="412" width="74" height="54" rx="4" fill="#F7F8F5" stroke="#C5CBC3"/><text x="287" y="436">吏部</text>
        <rect x="336" y="412" width="74" height="54" rx="4" fill="#F7F8F5" stroke="#C5CBC3"/><text x="373" y="436">户部</text>
        <rect x="422" y="412" width="74" height="54" rx="4" fill="#F7F8F5" stroke="#C5CBC3"/><text x="459" y="436">礼部</text>
        <rect x="508" y="412" width="74" height="54" rx="4" fill="#F7F8F5" stroke="#C5CBC3"/><text x="545" y="436">兵部</text>
        <rect x="594" y="412" width="74" height="54" rx="4" fill="#F7F8F5" stroke="#C5CBC3"/><text x="631" y="436">刑部</text>
        <rect x="680" y="412" width="74" height="54" rx="4" fill="#F7F8F5" stroke="#C5CBC3"/><text x="717" y="436">工部</text>
      </g>
      <g font-size="10.5" fill="#22507A" text-anchor="middle" font-family="'SFMono-Regular', 'Songti SC', Consolas, monospace">
        <text x="287" y="456">Worker</text><text x="373" y="456">Worker</text><text x="459" y="456">Worker</text><text x="545" y="456">Worker</text><text x="631" y="456">Worker</text><text x="717" y="456">Worker</text>
      </g>
    </g>

    <g>
      <rect x="200" y="512" width="260" height="72" rx="6" fill="#F7F8F5" stroke="#C5CBC3"/>
      <text x="330" y="542" text-anchor="middle" font-size="17" font-weight="900" fill="#1E2226">后湖黄册库 · 档案</text>
      <text x="330" y="566" text-anchor="middle" font-size="12" fill="#22507A" font-family="'SFMono-Regular', 'Songti SC', Consolas, monospace">持久化状态（数据库）</text>
    </g>

    <g>
      <rect x="550" y="512" width="260" height="72" rx="6" fill="#F7F8F5" stroke="#C5CBC3"/>
      <text x="680" y="542" text-anchor="middle" font-size="17" font-weight="900" fill="#1E2226">驿传 → 府州县</text>
      <text x="680" y="566" text-anchor="middle" font-size="12" fill="#22507A" font-family="'SFMono-Regular', 'Songti SC', Consolas, monospace">端侧 daemon · 执行环境</text>
    </g>
