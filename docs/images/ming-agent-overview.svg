    <path d="M330 480 L330 512" stroke="#1E2226" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
    <path d="M680 480 L680 512" stroke="#1E2226" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

    <g>
      <rect x="400" y="40" width="210" height="96" rx="6" fill="#F7F8F5" stroke="#A8841C" stroke-width="1.8"/>
      <text x="505" y="78" text-anchor="middle" font-size="24" font-weight="900" fill="#1E2226">皇帝</text>
      <text x="505" y="104" text-anchor="middle" font-size="13" fill="#22507A" font-family="'SFMono-Regular', 'Songti SC', Consolas, monospace">用户 · 决策与验收</text>
      <text x="505" y="124" text-anchor="middle" font-size="11.5" fill="#5A615F">只看结论，只做裁决</text>
    </g>

    <g>
      <rect x="40" y="40" width="220" height="96" rx="6" fill="#E1E7E1" stroke="#C5CBC3"/>
      <text x="150" y="74" text-anchor="middle" font-size="18" font-weight="900" fill="#1E2226">奏疏 · 塘报 · 民词</text>
      <text x="150" y="98" text-anchor="middle" font-size="12.5" fill="#22507A" font-family="'SFMono-Regular', 'Songti SC', Consolas, monospace">Trigger：IM / 邮件 / PR / CI</text>
      <text x="150" y="120" text-anchor="middle" font-size="11.5" fill="#5A615F">高噪音、低触发率</text>
    </g>

    <g>
      <rect x="40" y="196" width="220" height="82" rx="6" fill="#F7F8F5" stroke="#1E2226" stroke-width="1.4"/>
      <text x="150" y="228" text-anchor="middle" font-size="19" font-weight="900" fill="#1E2226">通政使司</text>
      <text x="150" y="252" text-anchor="middle" font-size="12.5" fill="#22507A" font-family="'SFMono-Regular', 'Songti SC', Consolas, monospace">事件过滤 · 程序层</text>
      <text x="150" y="270" text-anchor="middle" font-size="11.5" fill="#5A615F">违式者驳回，不入内阁</text>
    </g>

    <g>
