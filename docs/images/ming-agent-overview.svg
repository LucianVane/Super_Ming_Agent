    <path d="M150 278 C150 340 220 372 250 386" stroke="#B23A2E" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ahr)"/>
    <text x="14" y="330" font-size="12" fill="#B23A2E">已订阅：直通 Worker</text>
    <text x="14" y="346" font-size="12" fill="#B23A2E">（Fast Path · 部院照例）</text>
    <path d="M840 196 C780 160 680 200 628 222" stroke="#A8841C" stroke-width="1.8" stroke-dasharray="3 4" fill="none" marker-end="url(#ahg)"/>
    <path d="M840 300 C820 360 790 380 770 392" stroke="#A8841C" stroke-width="1.8" stroke-dasharray="3 4" fill="none" marker-end="url(#ahg)"/>
