<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-label="Super-agent 架构与明朝官制对应总图" font-family="Songti SC, SimSun, serif">
  <rect width="980" height="600" fill="#F7F8F5"/>
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E2226"/></marker>
      <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B23A2E"/></marker>
      <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A8841C"/></marker>
    </defs>

    <path d="M150 140 L150 196" stroke="#1E2226" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
    <path d="M232 236 L382 236" stroke="#1E2226" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
    <text x="268" y="226" font-size="12" fill="#5A615F">新事件（Slow Path）</text>
    <path d="M490 196 L490 138" stroke="#1E2226" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
    <path d="M520 138 L520 196" stroke="#B23A2E" stroke-width="1.6" fill="none" marker-end="url(#ahr)"/>
    <text x="530" y="172" font-size="12" fill="#B23A2E">批红 / 验收</text>
    <text x="378" y="172" font-size="12" fill="#5A615F">票拟草稿进呈</text>
    <path d="M505 278 L505 372" stroke="#1E2226" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
